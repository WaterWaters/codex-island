name: Preview release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.7.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      commit: ${{ steps.ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        id: ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify "refs/tags/$TAG"
          COMMIT=$(git rev-parse HEAD)
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/main
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Public files and documentation
        run: python3 Scripts/verify_repository.py
      - name: Release tests
        run: ./Scripts/test.sh -c release
      - name: Process sampler CPU calibration
        run: python3 Scripts/test_process_sampler.py
      - name: Universal app, DMG, ZIP and checksums
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: ./Scripts/package_release.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/CodexIsland-*-macos-universal.zip
            build/CodexIsland-*-macos-universal.dmg
            build/SHA256SUMS.txt
            build/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded assets
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          ACTUAL_COMMIT=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "$TAG" \
            "dist/CodexIsland-$TAG-macos-universal.zip" \
            "dist/CodexIsland-$TAG-macos-universal.dmg" \
            dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --verify-tag --draft --prerelease \
            --title "Codex Island $TAG — Preview" --notes-file dist/RELEASE_NOTES.md
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
